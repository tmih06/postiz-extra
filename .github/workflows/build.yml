---
name: Build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: actionlint -color

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'

      - name: Install dependencies and generate Prisma client
        run: bun install --frozen-lockfile

      - name: Verify lockfile immutability on repeated frozen install
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

      - name: Discover and run tests
        run: bun run test

      - name: Build all retained applications
        run: bun run build

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/extension/extension.zip
          if-no-files-found: error

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'

      - name: Install dependencies and generate Prisma client
        run: bun install --frozen-lockfile

      - name: Run code quality checks
        run: make check

  containers:
    needs: [workflow-validation, build, check]
    uses: ./.github/workflows/build-containers.yml
    permissions:
      contents: read
      packages: write
