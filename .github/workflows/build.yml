---
name: Build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate GitHub Actions workflows
        run: actionlint -color

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: pnpm

      - name: Install dependencies and generate Prisma client
        run: pnpm install --frozen-lockfile

      - name: Build frontend, backend, and orchestrator
        run: pnpm run build

      - name: Build extension
        run: pnpm run build:extension

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/extension/extension.zip
          if-no-files-found: error

  containers:
    needs: [workflow-validation, build]
    uses: ./.github/workflows/build-containers.yml
    permissions:
      contents: read
      packages: write
