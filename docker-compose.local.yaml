# Isolated development dependencies; does not reuse the deployed Postiz stack.
name: postiz-extra-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postiz-local
      POSTGRES_PASSWORD: postiz-local-pwd
      POSTGRES_DB: postiz-db-local
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postiz-local -d postiz-db-local']
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
  temporal:
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    entrypoint: ['temporal']
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--headless', '--db-filename', '/home/temporal/temporal.db']
    ports:
      - '127.0.0.1:17233:7233'
    volumes:
      - temporal:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres:
  temporal:
